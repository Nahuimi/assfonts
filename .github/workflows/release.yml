name: Publish Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version number
        id: get_version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')
          echo "version=$version" >> $GITHUB_OUTPUT

  build:
    needs: [get-version]
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            ext: ""
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            ext: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libgtk-3-dev libudev-dev

      - name: Build CLI
        run: cargo build --release --bin assfonts --target ${{ matrix.target }}

      - name: Build GUI
        run: cargo build --release -p assfonts-gui --bin assfonts-gui --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p artifacts
          7z a assfonts_v${VERSION}_${{ matrix.name }}.zip target/${{ matrix.target }}/release/assfonts.exe
          7z a assfonts-gui_v${VERSION}_${{ matrix.name }}.zip target/${{ matrix.target }}/release/assfonts-gui.exe
          cp assfonts_v${VERSION}_*.zip assfonts-gui_v${VERSION}_*.zip artifacts/

      - name: Package (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p artifacts
          tar -czf assfonts_v${VERSION}_${{ matrix.name }}.tar.gz -C target/${{ matrix.target }}/release assfonts
          tar -czf assfonts-gui_v${VERSION}_${{ matrix.name }}.tar.gz -C target/${{ matrix.target }}/release assfonts-gui
          cp assfonts_v${VERSION}_*.tar.gz assfonts-gui_v${VERSION}_*.tar.gz artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.name }}
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Create Release
    needs: [build, get-version]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Release v${{ needs.get-version.outputs.version }}
          files: |
            artifacts/*
          draft: true
          prerelease: false
          generate_release_notes: true
