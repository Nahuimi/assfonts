name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            ext: ""
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            ext: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libgtk-3-dev libudev-dev

      - name: Build CLI
        run: cargo build --release --bin assfonts --target ${{ matrix.target }}

      - name: Build GUI
        run: cargo build --release -p assfonts-gui --bin assfonts-gui --target ${{ matrix.target }}

      - name: Run tests
        run: cargo test

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/assfonts${{ matrix.ext }} artifacts/
          cp target/${{ matrix.target }}/release/assfonts-gui${{ matrix.ext }} artifacts/

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: assfonts-${{ matrix.name }}
          path: artifacts/assfonts${{ matrix.ext }}
          if-no-files-found: error

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: assfonts-gui-${{ matrix.name }}
          path: artifacts/assfonts-gui${{ matrix.ext }}
          if-no-files-found: error
